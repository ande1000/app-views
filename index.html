<!DOCTYPE html>
<html lang="pt-BR"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>visualização única</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
:root{
  --green: #17C155;
  --green-dark: #0C9A41;
  --yellow: #FFE600;
  --ink: #171717;
  --bubble: #5B5B5B;
  --card: #FFF6C4;
  --danger: #D6402C;
  --radius: 14px;
  font-family: 'Inter', system-ui, sans-serif;
}
*{ box-sizing: border-box; }
body{ margin:0; background: var(--yellow); color: var(--ink); min-height: 100vh; }
.topbar{ background: var(--green); border-bottom: 6px solid var(--green-dark); }
.topbar__inner{ max-width: 720px; margin: 0 auto; padding: 28px 24px; display:flex; align-items:center; gap: 12px; }
.topbar__mark{ display:inline-flex; flex-shrink:0; }
.topbar__title{ font-family:'Poppins', sans-serif; font-weight: 800; font-size: clamp(28px, 5vw, 42px); letter-spacing: -0.02em; margin:0; color: var(--ink); }
.board{ max-width: 720px; margin: 0 auto; padding: 28px 24px 60px; }
.board__lede{ font-size: 15px; line-height: 1.5; max-width: 50ch; margin: 0 0 10px; color: #2a2a2a; }
.dbstatus{
  display:flex; align-items:center; gap:8px; flex-wrap:wrap;
  font-size: 12.5px; color:#333; margin: 0 0 22px; padding: 8px 12px;
  background: rgba(0,0,0,0.06); border-radius: 8px;
}
.dbstatus button{
  border:none; background: var(--ink); color:#fff; font: inherit; font-weight:700;
  font-size: 12px; padding: 5px 10px; border-radius: 6px; cursor:pointer;
}
.dbstatus .dot{ width:8px;height:8px;border-radius:50%; background:#2ecc59; flex-shrink:0; }
.dbstatus.off .dot{ background:#c94b2e; }
.tool-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; }
.tool{ border-bottom: 1px solid rgba(0,0,0,0.12); }
.tool:first-child{ border-top: 1px solid rgba(0,0,0,0.12); }
.tool__row{
  width:100%; display:flex; align-items:center; gap: 16px; background:none; border:none;
  cursor:pointer; padding: 16px 6px; text-align:left; font: inherit; color: var(--ink);
  transition: transform .12s ease, background .12s ease; border-radius: 10px;
}
.tool__row:hover{ background: rgba(0,0,0,0.05); transform: translateX(2px); }
.tool__row:active{ transform: translateX(0) scale(.99); }
.tool__row:focus-visible{ outline: 3px solid var(--ink); outline-offset: 2px; }
.tool__bubble{
  width: 40px; height: 40px; border-radius: 50%; background: var(--bubble);
  display:flex; align-items:center; justify-content:center; flex-shrink:0;
  box-shadow: inset 0 -3px 0 rgba(0,0,0,0.15);
}
.tool__label{ font-family:'Poppins', sans-serif; font-weight: 700; font-size: 16px; letter-spacing: -0.01em; }
.tool[data-tool="contato"] .tool__label, .tool[data-tool="mensagem"] .tool__label{ font-size:15px; }
.overlay{
  position: fixed; inset: 0; background: rgba(10,10,10,0.55); display:flex;
  align-items:center; justify-content:center; padding: 20px; z-index: 50;
}
.overlay[hidden]{ display:none; }
.modal{
  background: var(--card); border: 3px solid var(--ink); border-radius: var(--radius);
  width: 100%; max-width: 480px; max-height: 88vh; overflow-y: auto;
  padding: 26px 24px 24px; position: relative; box-shadow: 8px 8px 0 rgba(0,0,0,0.25);
}
.modal__close{
  position:absolute; top: 12px; right: 12px; width: 32px; height: 32px; border-radius: 50%;
  border: 2px solid var(--ink); background: var(--yellow); font-size: 15px; font-weight: 700; cursor:pointer; line-height: 1;
}
.modal h2{ font-family:'Poppins', sans-serif; font-size: 21px; margin: 0 0 4px; }
.modal .hint{ font-size: 13px; color:#444; margin: 0 0 18px; line-height:1.45; }
.field{ margin-bottom: 16px; }
.field label{ display:block; font-weight: 600; font-size: 13px; margin-bottom: 6px; }
.field textarea, .field input[type="text"], .field input[type="tel"], .field input[type="url"]{
  width:100%; border: 2px solid var(--ink); border-radius: 8px; padding: 10px 12px;
  font: inherit; font-size: 14px; background:#fff; resize: vertical;
}
.field textarea{ min-height: 110px; }
.field.field--big textarea{ min-height: 200px; }
.filedrop{ border: 2px dashed var(--ink); border-radius: 10px; padding: 18px; text-align:center; background: #fff; cursor:pointer; width:100%; }
.filedrop input{ display:none; }
.filedrop small{ display:block; margin-top:4px; color:#555; }
.filedrop.has-file{ border-style: solid; background:#eefbef; }
.submit-btn{
  width:100%; margin-top: 6px; padding: 13px; border-radius: 10px; border: 3px solid var(--ink);
  background: var(--green); color: var(--ink); font-family:'Poppins', sans-serif; font-weight: 800;
  font-size: 15px; cursor:pointer; box-shadow: 4px 4px 0 rgba(0,0,0,0.25);
  transition: transform .1s ease, box-shadow .1s ease;
}
.submit-btn:hover{ transform: translate(-1px,-1px); box-shadow: 5px 5px 0 rgba(0,0,0,0.25); }
.submit-btn:active{ transform: translate(1px,1px); box-shadow: 2px 2px 0 rgba(0,0,0,0.25); }
.submit-btn:disabled{ opacity:.55; cursor:not-allowed; box-shadow:none; transform:none; }
.destruct-note{ display:flex; align-items:center; gap:6px; font-size: 12px; color:#444; margin-top: 14px; }
.setup-steps{ font-size: 13px; line-height:1.6; background:#fff; border:2px solid var(--ink); border-radius:10px; padding:14px 16px; margin-bottom:16px; }
.setup-steps ol{ margin:0; padding-left: 18px; }
.setup-steps code{ background:#eee; padding:1px 5px; border-radius:4px; font-size:12px; }
.setup-steps pre{
  background:#171717; color:#c9f7d6; padding:10px; border-radius:8px; font-size:11.5px;
  overflow-x:auto; margin: 8px 0;
}
.setup-steps a{ color: var(--green-dark); font-weight:700; }
.toast{
  position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); background: var(--ink);
  color: #fff; padding: 12px 18px; border-radius: 10px; font-size: 14px; font-weight: 600;
  z-index: 100; max-width: 90vw; text-align:center; box-shadow: 0 6px 20px rgba(0,0,0,0.3);
}
.toast[hidden]{ display:none; }
@media (max-width: 480px){
  .topbar__inner{ padding: 22px 18px; }
  .board{ padding: 22px 16px 50px; }
}
</style>
<meta name="theme-color" content="#7aff33"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="viewes"><link rel="manifest" href="manifest.json"><link rel="icon" sizes="192x192" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/icon-512.png"></head>
<body>

  <header class="topbar">
    <div class="topbar__inner">
      <span class="topbar__mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="30" height="30" fill="none">
          <path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12Z" stroke="#111" stroke-width="2" stroke-linejoin="round"></path>
          <circle cx="12" cy="12" r="2.8" fill="#111"></circle>
        </svg>
      </span>
      <h1 class="topbar__title">visualização única</h1>
    </div>
  </header>

  <main class="board">
    <p class="board__lede">Escolha uma ferramenta. O conteúdo fica guardado com segurança na nuvem — quando alguém abrir e visualizar, ele é apagado do servidor na hora, para sempre, em qualquer navegador ou celular.</p>

    <div class="dbstatus off" id="dbStatus">
      <span class="dot"></span>
      <span id="dbStatusText">Nenhum banco de dados configurado ainda</span>
      <button type="button" id="dbConfigBtn">Configurar</button>
    </div>

    <ul class="tool-list" id="toolList">
      <li class="tool" data-tool="texto">
        <button type="button" class="tool__row">
          <span class="tool__bubble"><svg viewBox="0 0 24 24" width="20" height="20" fill="none"><path d="M5 4h14v12H8l-3 3V4Z" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"></path><path d="M8 9h8M8 12.5h5" stroke="#fff" stroke-width="1.8" stroke-linecap="round"></path></svg></span>
          <span class="tool__label">enviar texto</span>
        </button>
      </li>
      <li class="tool" data-tool="audio">
        <button type="button" class="tool__row">
          <span class="tool__bubble"><svg viewBox="0 0 24 24" width="20" height="20" fill="none"><rect x="9" y="3" width="6" height="11" rx="3" stroke="#fff" stroke-width="1.8"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3" stroke="#fff" stroke-width="1.8" stroke-linecap="round"></path></svg></span>
          <span class="tool__label">enviar audio</span>
        </button>
      </li>
      <li class="tool" data-tool="foto">
        <button type="button" class="tool__row">
          <span class="tool__bubble"><svg viewBox="0 0 24 24" width="20" height="20" fill="none"><rect x="3" y="6" width="18" height="13" rx="2" stroke="#fff" stroke-width="1.8"></rect><path d="M8 6l1.6-2.4h4.8L16 6" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"></path><circle cx="12" cy="12.5" r="3.2" stroke="#fff" stroke-width="1.8"></circle></svg></span>
          <span class="tool__label">enviar foto</span>
        </button>
      </li>
      <li class="tool" data-tool="video">
        <button type="button" class="tool__row">
          <span class="tool__bubble"><svg viewBox="0 0 24 24" width="20" height="20" fill="none"><rect x="3" y="6" width="13" height="12" rx="2" stroke="#fff" stroke-width="1.8"></rect><path d="M16 10.5 21 8v8l-5-2.5" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"></path></svg></span>
          <span class="tool__label">enviar video</span>
        </button>
      </li>
      <li class="tool" data-tool="mensagem">
        <button type="button" class="tool__row">
          <span class="tool__bubble"><svg viewBox="0 0 24 24" width="20" height="20" fill="none"><path d="M4 5h16v10H10l-4 4v-4H4V5Z" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"></path><circle cx="8.5" cy="10" r="1" fill="#fff"></circle><circle cx="12" cy="10" r="1" fill="#fff"></circle><circle cx="15.5" cy="10" r="1" fill="#fff"></circle></svg></span>
          <span class="tool__label">inviar mensagens</span>
        </button>
      </li>
      <li class="tool" data-tool="notas">
        <button type="button" class="tool__row">
          <span class="tool__bubble"><svg viewBox="0 0 24 24" width="20" height="20" fill="none"><path d="M6 3h9l4 4v14H6V3Z" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"></path><path d="M15 3v4h4" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"></path><path d="M9 12h6M9 15.5h6" stroke="#fff" stroke-width="1.8" stroke-linecap="round"></path></svg></span>
          <span class="tool__label">bloco de notas</span>
        </button>
      </li>
      <li class="tool" data-tool="contato">
        <button type="button" class="tool__row">
          <span class="tool__bubble"><svg viewBox="0 0 24 24" width="20" height="20" fill="none"><rect x="3" y="4" width="18" height="16" rx="2" stroke="#fff" stroke-width="1.8"></rect><circle cx="9" cy="10.5" r="2.3" stroke="#fff" stroke-width="1.8"></circle><path d="M5.5 17c.8-2.2 2.4-3.2 3.5-3.2s2.7 1 3.5 3.2M15 9h4M15 12.5h4M15 16h3" stroke="#fff" stroke-width="1.8" stroke-linecap="round"></path></svg></span>
          <span class="tool__label">criar nota</span>
        </button>
      </li>
    </ul>
  </main>

  <div class="overlay" id="overlay" hidden="">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button type="button" class="modal__close" id="modalClose" aria-label="Fechar">✕</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <div class="toast" id="toast" hidden=""></div>

<script>
(function () {
  "use strict";

  const overlay = document.getElementById("overlay");
  const modalBody = document.getElementById("modalBody");
  const modalClose = document.getElementById("modalClose");
  const toastEl = document.getElementById("toast");
  const dbStatusEl = document.getElementById("dbStatus");
  const dbStatusText = document.getElementById("dbStatusText");
  const dbConfigBtn = document.getElementById("dbConfigBtn");
  let toastTimer = null;

  /* ---------------- toast / modal shell ---------------- */

  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => (toastEl.hidden = true), 3600);
  }

  function openModal(html) {
    modalBody.innerHTML = html;
    overlay.hidden = false;
    document.body.style.overflow = "hidden";
    const firstField = modalBody.querySelector("input, textarea, button.filedrop");
    if (firstField) firstField.focus({ preventScroll: true });
  }

  function closeModal() {
    overlay.hidden = true;
    modalBody.innerHTML = "";
    document.body.style.overflow = "";
  }

  modalClose.addEventListener("click", closeModal);
  overlay.addEventListener("click", (e) => { if (e.target === overlay) closeModal(); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !overlay.hidden) closeModal(); });

  /* ---------------- helpers ---------------- */

  function uid() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return "id-" + Date.now() + "-" + Math.random().toString(16).slice(2);
  }

  function jsString(str) {
    return JSON.stringify(str == null ? "" : str).replace(/<\/script/gi, "<\\/script");
  }

  function fileToDataURL(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = () => reject(reader.error);
      reader.readAsDataURL(file);
    });
  }

  function downloadHtml(filename, htmlString) {
    const blob = new Blob([htmlString], { type: "text/html" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  }

  function humanSize(bytes) {
    if (bytes < 1024) return bytes + " B";
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(0) + " KB";
    return (bytes / (1024 * 1024)).toFixed(1) + " MB";
  }

  /* ---------------- Firebase Realtime Database config ---------------- */
  // Guardamos só a URL do banco (não é segredo, é como um endereço).
  // Quem realmente protege o conteúdo é o ID aleatório de cada nota.

  const DB_KEY = "vu_db_url";

  function getDbUrl() {
    try { return (localStorage.getItem(DB_KEY) || "").trim(); } catch (e) { return ""; }
  }
  function setDbUrl(url) {
    try { localStorage.setItem(DB_KEY, url.trim().replace(/\/+$/, "")); } catch (e) {}
  }
  function clearDbUrl() {
    try { localStorage.removeItem(DB_KEY); } catch (e) {}
  }

  function refreshDbStatus() {
    const url = getDbUrl();
    if (url) {
      dbStatusEl.classList.remove("off");
      dbStatusText.textContent = "Banco conectado: " + url.replace(/^https?:\/\//, "");
      dbConfigBtn.textContent = "Trocar";
    } else {
      dbStatusEl.classList.add("off");
      dbStatusText.textContent = "Nenhum banco de dados configurado ainda";
      dbConfigBtn.textContent = "Configurar";
    }
  }
  refreshDbStatus();

  const SETUP_STEPS_HTML = `
    <div class="setup-steps">
      <ol>
        <li>Acesse <a href="https://console.firebase.google.com" target="_blank" rel="noopener">console.firebase.google.com</a> e crie um projeto (é grátis).</li>
        <li>No menu lateral: <strong>Compilação → Realtime Database → Criar banco de dados</strong>.</li>
        <li>Escolha qualquer região e inicie em modo de teste (vamos ajustar a regra a seguir).</li>
        <li>Na aba <strong>Regras</strong>, cole isto e clique em Publicar:
          <pre>{
  "rules": {
    "notes": {
      "$id": { ".read": true, ".write": true }
    }
  }
}</pre>
        </li>
        <li>Na aba <strong>Dados</strong>, copie a URL do banco (algo como <code>https://seu-projeto-default-rtdb.firebaseio.com</code>) e cole abaixo.</li>
      </ol>
    </div>`;

  function openDbConfigModal() {
    openModal(`
      <h2>Configurar banco de dados</h2>
      <p class="hint">É esse banco que guarda o conteúdo até alguém ver — e apaga na hora, para sempre, assim que é aberto. Sem ele, os arquivos não têm como funcionar.</p>
      ${SETUP_STEPS_HTML}
      <div class="field">
        <label for="dbUrlInput">URL do Realtime Database</label>
        <input type="url" id="dbUrlInput" placeholder="https://seu-projeto-default-rtdb.firebaseio.com" value="${getDbUrl()}">
      </div>
      <button class="submit-btn" id="dbSaveBtn">Salvar</button>
    `);
    modalBody.querySelector("#dbSaveBtn").addEventListener("click", () => {
      const val = modalBody.querySelector("#dbUrlInput").value.trim();
      if (!val || !/^https?:\/\//.test(val)) {
        return showToast("Cole uma URL válida do Realtime Database.");
      }
      setDbUrl(val);
      refreshDbStatus();
      showToast("Banco de dados salvo neste navegador.");
      closeModal();
    });
  }
  dbConfigBtn.addEventListener("click", openDbConfigModal);

  // Garante que existe uma URL configurada antes de continuar com um envio.
  // Se não existir, abre a configuração e o usuário tenta enviar de novo depois.
  function ensureDbUrl() {
    const url = getDbUrl();
    if (!url) {
      showToast("Configure o banco de dados primeiro (é rápido, só uma vez).");
      openDbConfigModal();
      return null;
    }
    return url;
  }

  /* ---------------- upload ao Firebase ---------------- */

  function uploadNote(dbUrl, id, payload) {
    return fetch(dbUrl + "/notes/" + id + ".json", {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    }).then((res) => {
      if (!res.ok) throw new Error("Falha ao salvar (HTTP " + res.status + ")");
      return res.json();
    });
  }

  /* ================================================================
     Gera o arquivo .html "visualizador" — ele NÃO carrega o conteúdo
     dentro de si. Ele só sabe o endereço do banco e o ID da nota.
     Quando alguém abre esse arquivo:
       1) busca o conteúdo no banco (precisa de internet)
       2) se existir, apaga do banco IMEDIATAMENTE (então ninguém,
          em nenhum outro navegador ou celular, consegue ver de novo)
       3) mostra o conteúdo só para quem abriu, e depois de um tempo
          ele some da tela também
       4) se o conteúdo já tiver sido apagado (já visto antes), mostra
          a mensagem de "isso já foi destruído"
     ================================================================ */
  function buildViewerPage(opts) {
    const { id, dbUrl, docTitle, heading, seconds, trigger } = opts;

    return `<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>${docTitle.replace(/</g, "&lt;")}</title>
<style>
  :root{ --green:#17C155; --yellow:#FFE600; --ink:#171717; --card:#FFF6C4; }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; background:var(--yellow); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Arial,sans-serif;
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .card{ background:var(--card); border:3px solid var(--ink); border-radius:14px; max-width:480px; width:100%; padding:26px 24px; box-shadow:8px 8px 0 rgba(0,0,0,.2); }
  .brand{ display:flex; align-items:center; gap:8px; margin-bottom:16px; font-weight:800; font-size:13px; color:#333; }
  .brand .dot{width:10px;height:10px;border-radius:50%;background:var(--green);display:inline-block}
  h1{ font-size:19px; margin:0 0 14px; }
  .content{ font-size:15px; line-height:1.55; word-wrap:break-word; white-space:pre-wrap; }
  .content img, .content video{ max-width:100%; border-radius:8px; display:block; }
  .content audio, .content video{ width:100%; }
  .content dl{ margin:0; } .content dt{ font-size:12px; font-weight:700; color:#555; margin-top:10px; text-transform:uppercase; }
  .content dd{ margin:2px 0 0; font-size:15px; }
  .timerbar{ margin-top:18px; display:flex; align-items:center; gap:10px; font-size:13px; color:#333; }
  .ring{ width:30px;height:30px;border-radius:50%; background:conic-gradient(var(--green) calc(var(--pct,100)*1%), #d8d8d8 0); display:flex;align-items:center;justify-content:center;flex-shrink:0; }
  .ring::after{ content:""; width:20px;height:20px;border-radius:50%;background:var(--card); }
  .destroyed{ text-align:center; padding:10px 0; }
  .destroyed .icon{ font-size:38px; display:block; margin-bottom:10px; }
  .destroyed h1{ font-size:18px; }
  .destroyed p{ font-size:14px; color:#444; line-height:1.5; }
  .waitmsg, .loadmsg{ font-size:13px; color:#555; margin-top:14px; }
  .playhint{ font-size:12px; color:#555; margin-top:8px; }
  .errormsg{ font-size:13px; color:#a02; margin-top:10px; }
  .spinner{ width:22px;height:22px;border-radius:50%; border:3px solid #ddd; border-top-color: var(--green); animation: spin 0.8s linear infinite; }
  @keyframes spin{ to { transform: rotate(360deg); } }
  .loadrow{ display:flex; align-items:center; gap:10px; }
</style>
</head>
<body>
  <div class="card">
    <div class="brand"><span class="dot"></span> visualização única</div>
    <div id="root">
      <div class="loadrow"><div class="spinner"></div><span class="loadmsg">Verificando este conteúdo...</span></div>
    </div>
  </div>
<script>
(function(){
  "use strict";
  var DB_URL = ${jsString(dbUrl)};
  var NOTE_ID = ${jsString(id)};
  var SECONDS = ${seconds};
  var TRIGGER = ${jsString(trigger)};
  var HEADING = ${jsString(heading)};
  var root = document.getElementById("root");
  var noteUrl = DB_URL + "/notes/" + NOTE_ID + ".json";

  function renderDestroyed(){
    root.innerHTML =
      '<div class="destroyed">' +
        '<span class="icon">&#128163;</span>' +
        '<h1>Este conteúdo se autodestruiu</h1>' +
        '<p>Ele já foi visualizado e apagado para sempre — não pode mais ser aberto por ninguém, em nenhum navegador ou celular.</p>' +
      '</div>';
  }

  function renderNetworkError(){
    root.innerHTML =
      '<div class="destroyed">' +
        '<span class="icon">&#128246;</span>' +
        '<h1>Sem conexão com a internet</h1>' +
        '<p>Este conteúdo fica guardado online até ser aberto. Conecte-se à internet e abra este arquivo de novo.</p>' +
      '</div>';
  }

  function startCountdown(){
    var total = SECONDS;
    var bar = document.createElement("div");
    bar.className = "timerbar";
    bar.innerHTML = '<span class="ring" id="ring"></span><span id="ringtxt">Este conteúdo some da tela em ' + total + 's</span>';
    root.appendChild(bar);
    var ring = bar.querySelector("#ring");
    var txt = bar.querySelector("#ringtxt");
    var remaining = total;
    var tick = setInterval(function(){
      remaining -= 1;
      var pct = Math.max(0, Math.round((remaining/total)*100));
      ring.style.setProperty("--pct", pct);
      if (remaining > 0){
        txt.textContent = "Este conteúdo some da tela em " + remaining + "s";
      } else {
        clearInterval(tick);
        renderDestroyed();
      }
    }, 1000);
  }

  function base64ToBlob(b64, mime){
    var binary = atob(b64);
    var len = binary.length;
    var bytes = new Uint8Array(len);
    for (var i = 0; i < len; i++){ bytes[i] = binary.charCodeAt(i); }
    return new Blob([bytes], { type: mime });
  }

  function renderContent(data){
    root.innerHTML = "";
    var h1 = document.createElement("h1");
    h1.textContent = HEADING;
    var contentDiv = document.createElement("div");
    contentDiv.className = "content";
    root.appendChild(h1);
    root.appendChild(contentDiv);

    if (data.kind === "media"){
      var mediaEl = document.createElement(data.mediaKind);
      mediaEl.controls = true;
      mediaEl.preload = "auto";
      mediaEl.setAttribute("playsinline", "");
      contentDiv.appendChild(mediaEl);

      var errBox = document.createElement("p");
      errBox.className = "errormsg";
      errBox.style.display = "none";
      errBox.textContent = "Não consegui carregar esse arquivo. Se for um vídeo .mov do iPhone, tente reexportar como .mp4 (H.264).";
      contentDiv.appendChild(errBox);
      function showLoadError(){ errBox.style.display = "block"; }
      mediaEl.addEventListener("error", showLoadError);
      var stallTimer = setTimeout(showLoadError, 15000);
      function clearStall(){ clearTimeout(stallTimer); }
      mediaEl.addEventListener("loadedmetadata", clearStall, { once:true });
      mediaEl.addEventListener("canplay", clearStall, { once:true });

      try {
        var blob = base64ToBlob(data.mediaB64, data.mediaMime);
        mediaEl.src = URL.createObjectURL(blob);
        mediaEl.load();
      } catch(e){ showLoadError(); }

      var hint = document.createElement("p");
      hint.className = "playhint";
      hint.textContent = "Toque em play para ouvir/assistir.";
      contentDiv.appendChild(hint);

      var waitMsg = document.createElement("p");
      waitMsg.className = "waitmsg";
      waitMsg.textContent = "A contagem para sumir da tela começa assim que terminar de " + (data.mediaKind === "audio" ? "tocar." : "assistir.");
      root.appendChild(waitMsg);

      mediaEl.addEventListener("ended", function(){
        waitMsg.remove();
        hint.remove();
        startCountdown();
      }, { once:true });

    } else if (data.kind === "fields"){
      var dl = document.createElement("dl");
      (data.fields || []).forEach(function(pair){
        var dt = document.createElement("dt");
        dt.textContent = pair[0];
        var dd = document.createElement("dd");
        dd.textContent = pair[1];
        dl.appendChild(dt);
        dl.appendChild(dd);
      });
      contentDiv.appendChild(dl);
      startCountdown();

    } else {
      contentDiv.textContent = data.text || "";
      startCountdown();
    }
  }

  fetch(noteUrl)
    .then(function(res){
      if (!res.ok) throw new Error("http " + res.status);
      return res.json();
    })
    .then(function(data){
      if (!data){
        renderDestroyed();
        return;
      }
      // Apaga do banco imediatamente: a partir daqui, em qualquer
      // outro navegador ou celular, este conteúdo já não existe mais.
      fetch(noteUrl, { method: "DELETE" }).catch(function(){});
      renderContent(data);
    })
    .catch(function(){
      renderNetworkError();
    });
})();
<\/script>
</body>
</html>`;
  }

  /* ---------------- modal templates + submit handlers ---------------- */

  function filedropMarkup(accept, labelText, hintText) {
    return `
      <button type="button" class="filedrop" id="dropZone">
        <div id="dropLabel">${labelText}</div>
        <small id="dropHint">${hintText}</small>
        <input type="file" id="fileInput" accept="${accept}">
      </button>`;
  }

  function wireFiledrop(onFile) {
    const zone = modalBody.querySelector("#dropZone");
    const input = modalBody.querySelector("#fileInput");
    const label = modalBody.querySelector("#dropLabel");
    const hint = modalBody.querySelector("#dropHint");
    zone.addEventListener("click", () => input.click());
    input.addEventListener("change", () => {
      const f = input.files[0];
      if (!f) return;
      zone.classList.add("has-file");
      label.textContent = f.name;
      hint.textContent = humanSize(f.size) + " — clique para trocar";
      onFile(f);
    });
  }

  function finishSend(dbUrl, id, payload, viewerOpts, filename, btn) {
    return uploadNote(dbUrl, id, payload)
      .then(() => {
        const html = buildViewerPage({ id, dbUrl, ...viewerOpts });
        downloadHtml(filename, html);
        showToast("Arquivo salvo! Já pode enviar pelo WhatsApp.");
        closeModal();
      })
      .catch((err) => {
        showToast("Não consegui salvar no banco de dados. Confira a URL configurada.");
        if (btn) { btn.disabled = false; btn.textContent = "Enviar"; }
      });
  }

      <p class="destruct-note">⏱️ some da tela 10s depois de aberto · destruído para sempre ao ser visto</p>

    `);

      try {
        const dataUrl = await fileToDataURL(file);
